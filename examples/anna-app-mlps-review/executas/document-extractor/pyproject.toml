[project]
name = "tool-intern2-document-extractor-u2n2j8x5"
version = "0.1.2"
description = "Anna Executa document text extractor for MLPS Review"
requires-python = ">=3.11"
dependencies = [
  "Pillow>=10.4.0",
  "PyMuPDF>=1.24.10",
  "pytesseract>=0.3.13",
  "python-docx>=1.1.2"
]

[project.scripts]
tool-intern2-document-extractor-u2n2j8x5 = "document_extractor_plugin:main"

[tool.uv]
package = true

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["document_extractor_plugin"]
