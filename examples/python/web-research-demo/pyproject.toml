[project]
name = "web-research-demo"
version = "0.1.0"
description = "Example Executa v2 web plugin — searches the web and extracts page content via host-managed reverse web/search + web/fetch"
requires-python = ">=3.10"
authors = [{ name = "Anna Developer" }]
license = { text = "MIT" }
dependencies = [
    "executa-sdk>=0.1.0",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.19.0"]

[project.scripts]
web-research-demo = "web_research:main"

# When installing from this repo (e.g. `uv tool install .`), resolve
# `executa-sdk` from the local path instead of PyPI.
[tool.uv.sources]
executa-sdk = { path = "../../../sdk/python", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["."]
only-include = ["web_research.py"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
