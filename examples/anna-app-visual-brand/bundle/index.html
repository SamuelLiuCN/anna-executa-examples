<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Visual Brand</title>
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-theme="light">
    <main class="shell">
      <aside class="sidebar">
        <header class="sidebar__head">
          <img src="icon.svg" alt="" width="28" height="28" />
          <span class="brand__name">Visual Brand</span>
        </header>

        <section class="panel">
          <label class="lbl" for="prompt">Prompt</label>
          <textarea id="prompt" rows="4" placeholder="A bold poster about the planet Mars"></textarea>

          <label class="lbl" for="style">Style</label>
          <select id="style">
            <option value="art-deco">Art Deco</option>
            <option value="cyberpunk">Cyberpunk</option>
            <option value="minimalist">Minimalist</option>
            <option value="watercolor">Watercolor</option>
            <option value="vintage-print">Vintage Print</option>
          </select>

          <label class="lbl" for="size">Size</label>
          <select id="size">
            <option value="1024x1024">1024 × 1024</option>
            <option value="1024x1536">1024 × 1536 (portrait)</option>
            <option value="1536x1024">1536 × 1024 (landscape)</option>
          </select>

          <label class="lbl" for="path">Call path</label>
          <select id="path">
            <option value="host">Host API — anna.image.* (direct)</option>
            <option value="rpc">Reverse RPC — via image_poster executa</option>
          </select>

          <label class="lbl" for="model">Model <small>(optional hint)</small></label>
          <select id="model">
            <option value="">user preference (default)</option>
            <option value="fal-ai/nano-banana-2">Nano Banana 2 (fal)</option>
            <option value="openai/gpt-image-2">GPT Image 2 (fal)</option>
            <option value="bytedance/seedream/v5/pro/text-to-image">Seedream 5.0 Pro (fal)</option>
            <option value="doubao-seedream-5-0-260128">Doubao Seedream 5.0</option>
            <option value="qwen-image-plus">Qwen Image Plus</option>
          </select>

          <label class="lbl" for="quality">Quality <small>(GPT-Image models)</small></label>
          <select id="quality">
            <option value="">model default</option>
            <option value="low">low — cheapest</option>
            <option value="medium">medium</option>
            <option value="high">high — best, most expensive</option>
          </select>

          <label class="lbl" for="resolution">Resolution <small>(Nano-Banana models)</small></label>
          <select id="resolution">
            <option value="">auto (from size)</option>
            <option value="0.5K">0.5K — 0.75× rate</option>
            <option value="1K">1K — base rate</option>
            <option value="2K">2K — 1.5× rate</option>
            <option value="4K">4K — 2× rate</option>
          </select>

          <button id="generate-btn" class="btn btn--primary" type="button">Generate</button>
          <button id="restyle-btn" class="btn" type="button" disabled>Restyle current</button>
          <button id="upload-btn" class="btn" type="button" disabled>Persist to host storage</button>

          <div id="status" class="status" aria-live="polite">Not connected.</div>
        </section>
      </aside>

      <section class="canvas">
        <div id="preview" class="preview preview--empty">
          <span class="preview__hint">Your generated image will appear here.</span>
        </div>
        <div class="meta">
          <span id="meta-model">model: —</span>
          <span id="meta-quota">quota: —</span>
          <span id="meta-r2">r2: —</span>
        </div>
        <div class="history" id="history" aria-label="Recent generations"></div>
      </section>
    </main>
    <script src="anna-tool-ids.js" defer></script>
    <script type="module" src="app.js"></script>
  </body>
</html>
